# Vhost de la VM — à déposer dans /etc/nginx/sites-available/app.koryx.net
# puis lier depuis sites-enabled.
#
# Le TLS est terminé en amont par Traefik : ce vhost ne parle que HTTP en
# clair, sur le réseau privé entre le frontal et la VM. Aucun certbot ici — le
# challenge HTTP-01 arriverait sur Traefik, jamais sur ce nginx.
#
# Une seule origine pour tout le produit :
#   /            → back-office Next.js   (conteneur admin, 127.0.0.1:3001)
#   /api/v1/     → API NestJS            (conteneur api,   127.0.0.1:3000)
#   /uploads/    → photos de biens servies statiquement par l'API
#
# Conséquence : le navigateur ne fait aucune requête cross-origin, donc pas de
# préflight CORS, pas de second certificat, pas de second enregistrement DNS.

# Traefik transmet le protocole d'origine. S'il est absent (appel direct à la
# VM), on retombe sur le schéma vu par nginx.
map $http_x_forwarded_proto $locadirect_proto {
    default $scheme;
    "~*^(http|https)$" $http_x_forwarded_proto;
}

# Laisse passer une bascule WebSocket si elle se présente, et renvoie un
# Connection vide sinon — indispensable pour que le `keepalive` des upstreams
# ci-dessous serve à quelque chose (un `Connection: close` le neutraliserait).
map $http_upgrade $locadirect_connection {
    default upgrade;
    ''      "";
}

upstream locadirect_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream locadirect_admin {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.koryx.net;

    access_log /var/log/nginx/locadirect.access.log;
    error_log  /var/log/nginx/locadirect.error.log;

    # Photos de biens, CNI, baux PDF. Doit rester supérieur à la plus grosse
    # pièce jointe acceptée par l'API.
    client_max_body_size 25m;

    # Le frontal est déjà en HTTPS ; ces en-têtes n'ont de sens que là où le
    # TLS est réellement terminé, mais ils coûtent zéro et couvrent le cas d'un
    # accès direct à la VM.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloc d'en-têtes partagé par tous les proxy_pass.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $locadirect_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $locadirect_connection;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ---------------------------------------------------------------- API --
    # Pas de barre oblique finale sur proxy_pass : l'URI est transmise telle
    # quelle, ce qui correspond au préfixe global `api/v1` de NestJS.
    location /api/v1/ {
        proxy_pass http://locadirect_api;
        # Un import ou une génération de PDF peut dépasser la minute.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ------------------------------------------------- Médias publics API --
    # Photos de biens uniquement (pas de PII : les documents de vérification
    # passent par une route protégée sous /api/v1).
    location /uploads/ {
        proxy_pass http://locadirect_api;
        expires 7d;
        # `add_header` dans un location remplace ceux du server : le nosniff est
        # répété ici, et il compte — ces fichiers sont téléversés par des tiers.
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------- Statiques du back-office --
    # Les artefacts /_next/static portent un hash de contenu : immuables.
    location /_next/static/ {
        proxy_pass http://locadirect_admin;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ------------------------------------------------------- Back-office --
    location / {
        proxy_pass http://locadirect_admin;
    }
}
