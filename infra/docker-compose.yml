version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: locadirect_postgres
    restart: always
    environment:
      POSTGRES_DB: locadirect_db
      POSTGRES_USER: locadirect_user
      POSTGRES_PASSWORD: locadirect_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./seeds/seed_douala_yaounde.sql:/docker-entrypoint-initdb.d/002_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locadirect_user -d locadirect_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: locadirect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: locadirect_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
